<style>
.phone{width:390px;height:844px;position:relative;overflow:hidden;font-family:'Prompt',system-ui,sans-serif;color:#1b2196;background:linear-gradient(172deg,#1157cf 0%,#1b8de0 32%,#36c2dc 62%,#9aeee2 100%);display:flex;flex-direction:column}
.phone button{font-family:inherit;cursor:pointer}
.phone a{color:#1d4ff0}
.scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.sky{position:absolute;left:0;right:0;top:70px;height:190px;opacity:.28;pointer-events:none}
.lang{position:absolute;top:14px;right:16px;z-index:40;display:flex;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.55);border-radius:999px;padding:3px;backdrop-filter:blur(8px)}
.lb{border:0;background:transparent;color:#fff;font-weight:600;font-size:12px;padding:0 12px;min-height:32px;border-radius:999px}
.lb.on{background:#fff;color:#1b4fd8}
.hero{position:relative;padding:62px 22px 0;height:250px;box-sizing:border-box}
.h1{font-size:36px;line-height:1.04;font-weight:700;color:#fff;margin:0;letter-spacing:-.4px;max-width:230px;word-break:break-word}
.hsub{color:#fff;font-size:14px;line-height:1.45;margin:12px 0 0;max-width:205px}
.mascot{position:absolute;right:-6px;bottom:-14px;width:190px;height:158px;object-fit:cover;-webkit-mask-image:radial-gradient(ellipse 58% 60% at 50% 55%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 58% 60% at 50% 55%,#000 62%,transparent 100%);animation:bob 3.2s ease-in-out infinite}
.bubble{position:absolute;background:#fff;border-radius:18px;padding:8px 12px;font-size:12.5px;line-height:1.3;font-weight:600;color:#1b4fd8;box-shadow:0 8px 20px rgba(10,50,150,.2);max-width:150px}
.sheet{position:relative;border-radius:40px 40px 0 0;background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.22) 45%,rgba(255,255,255,.1));padding:18px 14px 30px;display:flex;flex-direction:column;gap:12px;min-height:560px;box-sizing:border-box}
.card{background:rgba(255,255,255,.95);border-radius:24px;box-shadow:0 10px 26px rgba(16,64,170,.14);padding:16px;box-sizing:border-box}
.lbtn{width:100%;border:0;text-align:left;display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.95);border-radius:24px;padding:12px 14px;box-shadow:0 10px 24px rgba(16,64,170,.13);color:inherit;font-size:inherit}
.tile{width:60px;height:60px;border-radius:18px;display:flex;align-items:center;justify-content:center;flex:none}
.ttl{font-size:19px;font-weight:700;color:#1b2196;margin:0;line-height:1.2}
.dsc{font-size:13px;color:#4650cf;margin:3px 0 0;line-height:1.35}
.grow{flex:1 1 auto;min-width:0}
.cta{width:100%;border:0;border-radius:24px;padding:18px;color:#fff;text-align:left;background:linear-gradient(120deg,#1d4ff0,#3a8bff 55%,#33c4e0);box-shadow:0 14px 30px rgba(29,79,240,.35);display:flex;align-items:center;gap:14px}
.pbtn{border:0;border-radius:18px;min-height:52px;padding:0 20px;font-size:16px;font-weight:600;color:#fff;background:linear-gradient(120deg,#1d4ff0,#3a8bff);box-shadow:0 10px 22px rgba(29,79,240,.3)}
.gbtn{border:1.5px solid #c9d5fb;border-radius:16px;min-height:48px;padding:0 16px;font-size:14px;font-weight:600;color:#1b2196;background:#fff}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:999px;white-space:nowrap}
.sec{font-size:19px;font-weight:700;color:#141c8f;margin:6px 4px 0}
.sechead{display:flex;justify-content:space-between;align-items:center;margin:6px 4px 0}
.link{border:0;background:transparent;color:#1d4ff0;font-size:13.5px;font-weight:600;min-height:40px;padding:0 4px}
.top{padding:56px 18px 14px;display:flex;align-items:center;gap:12px;color:#fff}
.back{width:44px;height:44px;border-radius:14px;border:0;background:rgba(255,255,255,.24);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.tt{font-size:22px;font-weight:700;margin:0;color:#fff;line-height:1.2}
.nav{height:84px;flex:none;background:rgba(255,255,255,.97);border-radius:30px 30px 0 0;display:flex;justify-content:space-around;align-items:flex-start;padding-top:8px;box-sizing:border-box;box-shadow:0 -6px 22px rgba(16,64,170,.14);position:relative;z-index:20}
.nb{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:500;color:#7f8fe0;min-width:76px;min-height:52px;padding:4px 0;position:relative}
.nb.on{color:#1d4ff0;font-weight:700}
.nb.on::after{content:'';position:absolute;bottom:-8px;width:52px;height:4px;border-radius:4px;background:#1d4ff0}
.bar{height:12px;border-radius:999px;background:#e3e9fb;overflow:hidden}
.fill{height:100%;border-radius:999px;transition:width .6s ease}
.opt{width:100%;border:2px solid transparent;background:#fff;border-radius:20px;padding:13px 14px;display:flex;gap:12px;align-items:center;text-align:left;font-size:14.5px;line-height:1.35;color:#1b2196;box-shadow:0 8px 20px rgba(16,64,170,.12);transition:all .2s}
.opt.sel{border-color:#1d4ff0;background:#eef3ff}
.letter{width:36px;height:36px;border-radius:12px;background:#e6edff;color:#1d4ff0;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.opt.sel .letter{background:#1d4ff0;color:#fff}
.phone input[type=range]{width:100%;accent-color:#1d4ff0;height:28px}
.seg{display:flex;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.5);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;color:#fff;font-size:14px;font-weight:600;min-height:42px;border-radius:12px}
.seg button.on{background:#fff;color:#1d4ff0;box-shadow:0 4px 12px rgba(10,40,140,.18)}
.hrow{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -14px;padding:2px 14px 8px;scrollbar-width:none}
.hrow::-webkit-scrollbar{display:none}
.bnr{flex:none;width:318px;height:156px;border:0;border-radius:26px;scroll-snap-align:start;color:#fff;text-align:left;padding:18px;box-sizing:border-box;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 12px 26px rgba(16,40,140,.25)}
.cats{display:flex;gap:8px;overflow-x:auto;margin:0 -14px;padding:2px 14px 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;border:1.5px solid rgba(255,255,255,.9);background:rgba(255,255,255,.85);color:#1b2196;border-radius:999px;min-height:40px;padding:0 16px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.cat.on{background:#1d4ff0;border-color:#1d4ff0;color:#fff}
.short{flex:none;width:146px;height:260px;border:0;border-radius:22px;scroll-snap-align:start;color:#fff;text-align:left;padding:12px;box-sizing:border-box;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.od{width:100%;border:0;background:rgba(255,255,255,.96);border-radius:22px;padding:10px;display:flex;gap:12px;align-items:center;text-align:left;box-shadow:0 8px 20px rgba(16,64,170,.12);color:inherit}
.thumb{width:118px;height:78px;border-radius:16px;flex:none;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.feed{height:640px;overflow-y:auto;scroll-snap-type:y mandatory;padding:0 14px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.vid{flex:none;height:620px;border-radius:28px;scroll-snap-align:start;position:relative;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;box-sizing:border-box}
.vbtn{border:0;border-radius:16px;min-height:48px;padding:0 14px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th,.tbl td{padding:9px 4px;text-align:center;border-bottom:1px solid #e8edfb}
.tbl td:first-child,.tbl th:first-child{text-align:left;color:#1b2196}
.swi{width:22px;height:22px;accent-color:#1d4ff0;flex:none}
.tg{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:999px;background:#cfd8f3;position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:left .2s}
.tg:checked{background:#1d4ff0}
.tg:checked::after{left:23px}
.prow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eef1fb;font-size:14px;color:#1b2196}
.prow:last-child{border-bottom:0}
.rowbtn{width:100%;border:0;border-bottom:1px solid #eef1fb;background:transparent;text-align:left;color:#1b2196;padding:0;min-height:50px;font-size:14px;display:flex;align-items:center;gap:12px}
.rowbtn:last-child{border-bottom:0}
.ricon{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.splash{flex:1 1 auto;width:100%;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;color:#fff;padding:0;background:radial-gradient(circle at 50% 34%,#2a63f5 0%,#0d2f86 42%,#06123a 100%);position:relative}
.load{width:150px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:40px}
.load span{display:block;height:100%;width:40%;border-radius:4px;background:linear-gradient(90deg,#4be0d0,#fff);animation:load 1.6s ease-in-out infinite}
.dot{width:9px;height:9px;border-radius:50%;background:#fff;display:inline-block;animation:dot 1s ease-in-out infinite}
.toast{position:absolute;left:18px;right:18px;bottom:100px;z-index:60;background:#141c8f;color:#fff;border-radius:16px;padding:12px 16px;font-size:13.5px;box-shadow:0 12px 26px rgba(0,0,0,.25)}
.ovl{position:absolute;inset:0;z-index:55;background:rgba(6,18,58,.55);display:flex;align-items:flex-end;padding:14px;box-sizing:border-box}
.ovlcard{width:100%;background:#fff;border-radius:28px;padding:22px;box-sizing:border-box;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes dot{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes load{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:.7}}
.pop{animation:pop .5s cubic-bezier(.2,.9,.3,1.3)}

.fab{position:absolute;right:16px;bottom:100px;z-index:45;width:60px;height:60px;border-radius:50%;border:0;background:linear-gradient(135deg,#1d4ff0,#2fc6d8);box-shadow:0 12px 28px rgba(16,40,140,.4);display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer}
.fab .ping{position:absolute;top:3px;right:3px;width:14px;height:14px;border-radius:50%;background:#ff4f7d;border:2px solid #fff}
.chat{position:absolute;inset:0;z-index:58;background:rgba(6,18,58,.5);display:flex;align-items:flex-end}
.chatbox{width:100%;height:91%;background:#f4f7fe;border-radius:30px 30px 0 0;display:flex;flex-direction:column;overflow:hidden}
.chathead{background:linear-gradient(120deg,#1d4ff0,#2fc6d8);color:#fff;padding:16px 16px 12px;flex:none}
.msgs{flex:1 1 auto;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:10px 13px;border-radius:18px;font-size:13.5px;line-height:1.5;white-space:pre-line;box-sizing:border-box}
.msg.me{align-self:flex-end;background:#1d4ff0;color:#fff;border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:#fff;color:#1b2196;border-bottom-left-radius:6px;box-shadow:0 4px 12px rgba(16,64,170,.08)}
.msg .mact{display:block;margin-top:8px;border:0;background:#eef3ff;color:#1d4ff0;border-radius:12px;min-height:36px;padding:0 12px;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer}
.qr{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 10px;scrollbar-width:none;flex:none}
.qr::-webkit-scrollbar{display:none}
.qr button{flex:none;border:1.5px solid #c9d5fb;background:#fff;color:#1d4ff0;border-radius:999px;min-height:38px;padding:0 14px;font-size:12.5px;font-weight:600}
.composer{display:flex;gap:8px;padding:10px 12px 18px;background:#fff;border-top:1px solid #e6ebf8;flex:none;box-sizing:border-box}
.composer input{flex:1;min-width:0;border:1.5px solid #c9d5fb;border-radius:999px;padding:0 16px;min-height:46px;font-size:14px;font-family:inherit;color:#1b2196;background:#fff}
.send{width:46px;height:46px;border-radius:50%;border:0;background:#1d4ff0;color:#fff;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer}
.sticky{position:sticky;top:8px;z-index:15}
.art{flex:none;width:220px;border:0;background:#fff;border-radius:22px;overflow:hidden;text-align:left;padding:0;box-shadow:0 8px 20px rgba(16,64,170,.12);color:inherit;scroll-snap-align:start;cursor:pointer}
.artimg{height:104px;display:flex;align-items:center;justify-content:center;position:relative}
.slot{border:1.5px solid #c9d5fb;background:#fff;color:#1b2196;border-radius:14px;min-height:44px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer}
.slot.on{background:#1d4ff0;border-color:#1d4ff0;color:#fff}
.slot:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.sheetbot{position:absolute;inset:0;z-index:56;background:rgba(6,18,58,.55);display:flex;align-items:flex-end}
.sheetcard{width:100%;max-height:88%;overflow-y:auto;background:#fff;border-radius:28px 28px 0 0;padding:20px 20px 28px;box-sizing:border-box}
.inp{display:block;width:100%;box-sizing:border-box;margin-top:6px;border:2px solid #c9d5fb;border-radius:14px;padding:11px 14px;font-size:16px;font-family:inherit;color:#1b2196;background:#fff}
.lbl{font-size:12.5px;font-weight:600;color:#1b2196;line-height:1.3}
.av{border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.livedot{width:8px;height:8px;border-radius:50%;background:#fff;display:inline-block;animation:dot 1s ease-in-out infinite}

html,body{margin:0;padding:0;background:#dfe9f7;-webkit-tap-highlight-color:transparent}
#app{display:flex;justify-content:center;align-items:center;min-height:100vh;padding:24px 0;box-sizing:border-box}
#app .phone{border-radius:44px;box-shadow:0 30px 60px rgba(16,40,120,.3)}
@media (max-width:520px){
  #app{display:block;padding:0;min-height:0}
  #app .phone{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
  .phone input,.phone textarea,.phone select{font-size:16px !important}
}
</style>

<script>setTemplate("<div class=\"phone\" style=\"font-family:'Prompt',system-ui,sans-serif;color:#1b2196\">\n\n<sc-if value=\"{{notSplash}}\" hint-placeholder-val=\"{{true}}\">\n<div class=\"lang\" role=\"group\" aria-label=\"Language\">\n<button class=\"lb {{thOn}}\" onClick=\"{{setTH}}\">TH</button>\n<button class=\"lb {{enOn}}\" onClick=\"{{setEN}}\">EN</button>\n</div>\n</sc-if>\n\n<!-- ============ 1.1 SPLASH (new logo) ============ -->\n<sc-if value=\"{{isSplash}}\" hint-placeholder-val=\"{{true}}\">\n<button class=\"splash\" onClick=\"{{skipSplash}}\" aria-label=\"Continue\">\n<span style=\"position:absolute;width:320px;height:320px;border-radius:50%;top:150px;background:radial-gradient(circle,rgba(75,224,208,.35),transparent 65%);animation:glow 2.4s ease-in-out infinite\"></span>\n<span class=\"pop\" style=\"position:relative;filter:drop-shadow(0 18px 40px rgba(0,0,0,.35))\">\n<img src=\"{{IMG.logo}}\" alt=\"Retirement Ready logo\" style=\"display:block;width:210px;height:210px;border-radius:48px\">\n</span>\n<span style=\"font-size:11.5px;letter-spacing:3.2px;opacity:.75;margin-top:22px\">RRI · RETIREMENT READINESS INDEX</span>\n<span style=\"width:40px;height:2px;background:rgba(255,255,255,.35);margin:26px 0 22px\"></span>\n<span style=\"font-size:21px;font-weight:600;line-height:1.35;text-align:center\">How ready are <span style=\"color:#6ff0dd\">YOU</span><br>for retirement?</span>\n<span style=\"font-size:14px;opacity:.8;margin-top:8px\">{{t.sloganSub}}</span>\n<span class=\"load\"><span></span></span>\n<span style=\"position:absolute;bottom:34px;font-size:11px;letter-spacing:1.5px;opacity:.55\">ADT INNOFEST 2026 · DEMO</span>\n</button>\n</sc-if>\n\n<!-- ============ 1.2 CONSENT & START ============ -->\n<sc-if value=\"{{isConsent}}\" hint-placeholder-val=\"{{false}}\">\n<div class=\"scroll\" style=\"display:flex;flex-direction:column;align-items:center;padding:58px 22px 30px;box-sizing:border-box;text-align:center;color:#fff\">\n<img class=\"pop\" src=\"{{IMG.logo}}\" alt=\"Retirement Ready logo\" style=\"display:block;width:200px;height:200px;border-radius:46px;margin-top:22px;box-shadow:0 18px 40px rgba(6,30,110,.35)\">\n<p style=\"font-size:29px;font-weight:700;margin:22px 0 0;line-height:1.25;letter-spacing:.2px;color:#ffffff;-webkit-font-smoothing:antialiased;text-shadow:0 1px 1px rgba(0,0,0,.35),0 3px 8px rgba(0,0,0,.28),0 8px 22px rgba(0,0,0,.18)\">How ready are <span style=\"color:#7ff0dd;font-size:33px\">YOU</span><br>for retirement?</p>\n<p style=\"font-size:14.5px;margin:8px 0 0;opacity:.95\">{{t.consentLead}}</p>\n<button class=\"pbtn\" onClick=\"{{start}}\" style=\"width:100%;min-height:62px;font-size:19px;margin-top:28px;background:#fff;color:#1d4ff0;box-shadow:0 14px 30px rgba(10,40,140,.3)\">{{t.startBtn}}</button>\n<label style=\"display:flex;gap:10px;align-items:flex-start;text-align:left;margin-top:16px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.45;cursor:pointer;width:100%;box-sizing:border-box\">\n<input type=\"checkbox\" class=\"swi\" checked=\"{{consent}}\" onChange=\"{{toggleConsent}}\">\n<span><strong>PDPA</strong> · {{t.pdpa}} <button onClick=\"{{openPrivacyDoc}}\" style=\"border:0;background:transparent;color:#fff;text-decoration:underline;font-size:13px;padding:0\">{{t.readPolicy}}</button></span>\n</label>\n<sc-if value=\"{{consentWarn}}\" hint-placeholder-val=\"{{false}}\">\n<p style=\"margin:10px 0 0;font-size:13px;font-weight:600;background:#fff3f6;color:#c0174f;border-radius:12px;padding:8px 12px\">{{t.pdpaWarn}}</p>\n</sc-if>\n<button onClick=\"{{toggleAlt}}\" style=\"border:0;background:transparent;color:#fff;font-size:13.5px;text-decoration:underline;margin-top:14px;min-height:44px\">{{t.altLogin}}</button>\n<sc-if value=\"{{showAlt}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display:flex;flex-direction:column;gap:10px;width:100%\">\n<button class=\"gbtn\" onClick=\"{{start}}\" style=\"display:flex;align-items:center;justify-content:center;gap:10px\">\n<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z\" fill=\"#4285F4\"></path><path d=\"M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z\" fill=\"#34A853\"></path><path d=\"M6.4 14a6 6 0 0 1 0-3.9V7.5H3.1a10 10 0 0 0 0 9.1z\" fill=\"#FBBC05\"></path><path d=\"M12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.5L6.4 10C7.2 7.8 9.4 6 12 6z\" fill=\"#EA4335\"></path></svg>\nContinue with Google</button>\n<button class=\"gbtn\" onClick=\"{{start}}\" style=\"display:flex;align-items:center;justify-content:center;gap:10px\">\n<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1b2196\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 5h18v14H3z M3 6l9 7 9-7\"></path></svg>\n{{t.withEmail}}</button>\n</div>\n</sc-if>\n</div>\n</sc-if>\n\n<!-- ============ 1.3 NAME INPUT ============ -->\n<sc-if value=\"{{isName}}\" hint-placeholder-val=\"{{false}}\">\n<div class=\"scroll\" style=\"padding:64px 22px 30px;box-sizing:border-box;display:flex;flex-direction:column\">\n<button class=\"back\" onClick=\"{{backToConsent}}\" aria-label=\"Back\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 6l-6 6 6 6\"></path></svg></button>\n<div style=\"position:relative;height:250px;margin-top:10px\">\n<div class=\"bubble pop\" style=\"left:0;top:20px;max-width:210px;font-size:15px;padding:14px 16px;border-radius:22px 22px 22px 6px\">{{t.nameGreet}}</div>\n<img src=\"{{IMG.mascot}}\" alt=\"\" class=\"mascot\" style=\"right:-10px;bottom:0;width:240px;height:200px\">\n</div>\n<div class=\"card\" style=\"margin-top:6px;padding:22px\">\n<label for=\"nm\" style=\"font-size:15px;font-weight:600;color:#1b2196\">{{t.nameLabel}}</label>\n<input id=\"nm\" type=\"text\" value=\"{{name}}\" onChange=\"{{onName}}\" placeholder=\"{{t.namePh}}\" maxlength=\"20\" style=\"display:block;width:100%;box-sizing:border-box;margin-top:10px;border:2px solid #c9d5fb;border-radius:16px;padding:14px 16px;font-size:18px;font-family:inherit;color:#1b2196;outline-color:#1d4ff0\">\n<button class=\"pbtn\" onClick=\"{{letsGo}}\" style=\"width:100%;margin-top:16px;min-height:58px;font-size:18px\">{{t.letsGo}}</button>\n</div>\n</div>\n</sc-if>\n\n<!-- ============ APP SHELL ============ -->\n<sc-if value=\"{{isApp}}\" hint-placeholder-val=\"{{false}}\">\n<div class=\"scroll\" ref=\"{{scrollRef}}\">\n<svg class=\"sky\" viewBox=\"0 0 390 190\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M150 190V90h22v-30h18v130 M195 190V40h30v150 M232 190V100h16V70h20v120 M275 190V20h34v170 M314 190V80h22v110 M342 190V55h30v135 M0 190V130h24v60 M30 190V110h28v80\" fill=\"#ffffff\"></path></svg>\n\n<!-- ===== SURVEY ===== -->\n<sc-if value=\"{{inSurvey}}\" hint-placeholder-val=\"{{false}}\">\n<div class=\"top\">\n<button class=\"back\" onClick=\"{{surveyBack}}\" aria-label=\"Back\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 6l-6 6 6 6\"></path></svg></button>\n<div class=\"grow\" style=\"padding-right:96px\">\n<p style=\"margin:0;font-size:13px;opacity:.9\">{{t.question}} {{qNum}} / 10</p>\n<div style=\"height:8px;background:rgba(255,255,255,.3);border-radius:8px;margin-top:6px;overflow:hidden\"><div style=\"height:100%;background:#fff;border-radius:8px;transition:width .4s;width:{{qPct}}%\"></div></div>\n</div>\n</div>\n<div style=\"position:relative;height:150px;margin:0 18px\">\n<div class=\"bubble pop\" style=\"left:0;top:18px;max-width:200px;border-radius:20px 20px 20px 6px;font-size:14px\">{{bubbleLine}}</div>\n<img src=\"{{IMG.mascot}}\" alt=\"\" class=\"mascot\" style=\"right:-14px;bottom:-8px;width:170px;height:142px\">\n</div>\n<div class=\"sheet\" style=\"min-height:540px\">\n<div class=\"card\">\n<span class=\"chip\" style=\"background:{{qDim.bg}};color:{{qDim.fg}}\">{{qDim.dimLabel}}</span>\n<p style=\"font-size:19px;font-weight:600;margin:10px 0 0;line-height:1.4;color:#141c8f\">{{qText}}</p>\n</div>\n<sc-for list=\"{{opts}}\" as=\"o\" hint-placeholder-count=\"4\">\n<button class=\"opt {{o.cls}}\" onClick=\"{{o.pick}}\"><span class=\"letter\">{{o.letter}}</span><span>{{o.text}}</span></button>\n</sc-for>\n</div>\n</sc-if>\n\n<sc-if value=\"{{showTabs}}\" hint-placeholder-val=\"{{true}}\">\n\n<!-- ===== HOME ===== -->\n<sc-if value=\"{{isHome}}\" hint-placeholder-val=\"{{true}}\">\n<div class=\"hero\" style=\"padding-top:60px;height:252px\">\n<button onClick=\"{{goProfile}}\" style=\"border:0;background:transparent;display:flex;align-items:center;gap:12px;padding:0;text-align:left;color:#fff;max-width:250px\">\n<span style=\"width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#fff,#d8ecff);border:3px solid rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#1d4ff0;flex:none;box-shadow:0 8px 18px rgba(10,40,140,.25)\">{{initial}}</span>\n<span style=\"min-width:0\"><span style=\"display: block; font-size: 13px; opacity: .92; position: relative\">{{t.hello}}</span><span style=\"display:block;font-size:22px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{displayName}}</span><span class=\"chip\" style=\"background:rgba(255,255,255,.92);color:#1d4ff0;margin-top:4px;font-size:10.5px;padding:3px 8px\">{{homeBadge}}</span></span>\n</button>\n<p style=\"color:#fff;font-size:22px;font-weight:700;line-height:1.25;margin:22px 0 0;max-width:200px\">How ready are YOU for retirement?</p>\n<div cla class Component extends DCLogic {
  constructor(props){
    super(props);
    this.state = initState(props.preset);
    this.scrollEl = null;
    this.lastKey = '';
  }
  componentDidMount(){ this.armSplash(); }
  armSplash(){
    clearTimeout(this.splashT);
    var p = this.props.preset || 'play';

  componentWillUnmount(){ clearTimeout(this.splashT); clearTimeout(this.toastT); clearTimeout(this.advT); clearInterval(this.playT); clearTimeout(this.botT); clearTimeout(this.exT); }
  componentDidUpdate(prevProps){
    if (prevProps.preset !== this.props.preset) { clearInterval(this.playT); this.setState(initState(this.props.preset), () => this.armSplash()); return; }
    var s = this.state;
    var key = s.screen + '|' + s.tab + '|' + s.aView + '|' + s.sub + '|' + s.inSurvey + '|' + s.qIdx + '|' + s.odCat + '|' + s.policyKey + '|' + s.artId + '|' + s.threadId + '|' + s.toolTab + '|' + s.artCat + '|' + s.productKey;
    if (key !== this.lastKey) { this.lastKey = key; if (this.scrollEl) this.scrollEl.scrollTop = 0; }
    var ck = s.chatOpen + '|' + s.chatTab + '|' + (s.aiMsgs ? s.aiMsgs.length : 0) + '|' + s.exMsgs.length + '|' + s.aiTyping;
    if (ck !== this.lastChat) { this.lastChat = ck; if (this.msgsEl) this.msgsEl.scrollTop = this.msgsEl.scrollHeight; }
    if (s.sub !== 'player' && this.playT) { clearInterval(this.playT); this.playT = null; if (s.playing) this.setState({ playing:false }); }
  }
  showToast(msg){ clearTimeout(this.toastT); this.setState({ toast: msg }); this.toastT = setTimeout(() => this.setState({ toast:'' }), 2400); }

  calc(answers){
    var a = answers;
    var qs = function(i){ return a[i] == null ? 0 : a[i] / 3 * 100; };
    var ds = DIMS.map(function(d){ return Object.assign({}, d, { score: Math.round((qs(d.q[0]) + qs(d.q[1])) / 2) }); });
    var exact = ds.reduce(function(m, d){ return m + d.w * ((qs(d.q[0]) + qs(d.q[1])) / 2); }, 0);
    var total = Math.round(exact);
    // K-Prototypes style assignment: numeric distance on 9 answers + categorical mismatch (dependents, Q7) weighted by gamma = 2
    var dists = {}, persona = null;
    Object.keys(CENT).forEach(function(k){
      var c = CENT[k], d = 0;
      for (var i = 0; i < 10; i++) { var v = a[i] == null ? 0 : a[i]; if (i === 6) d += (v !== c[i] ? 2 : 0); else d += Math.abs(v - c[i]); }
      dists[k] = d; if (persona === null || d < dists[persona]) persona = k;
    });
    var prob = clamp(Math.round(10 + total * 0.86), 5, 95);
    return { ds: ds, total: total, exact: exact, persona: persona, prob: prob, qs: qs, dists: dists };
  }

  renderVals(){
    var self = this, s = this.state, L = s.lang, t = TX[L];
    var set = function(o){ return function(){ self.setState(o); }; };
    var name = (s.name || '').trim();
    var displayName = name ? (L === 'th' ? 'คุณ' + name : name) : t.guest;
    var initial = name ? name.charAt(0).toUpperCase() : 'R';
    var res = this.calc(s.answers);
    var dimOf = function(k){ return DIMS.filter(function(d){ return d.k === k; })[0]; };
    var lvlIdx = res.total >= 75 ? 0 : res.total >= 55 ? 1 : res.total >= 35 ? 2 : 3;
    var LVC = [['#dcf7ea','#0b7a4f'],['#dcf7ea','#0b7a4f'],['#fff2cc','#7a4f00'],['#ffe3ea','#b8174c']];
    var level = { label: t.lv[lvlIdx], bg: LVC[lvlIdx][0], fg: LVC[lvlIdx][1] };
    var P = PERSONAS[res.persona];
    var persona = { name: P.name, desc: P[L] };
    var dlab = function(sc){ return t.dl[sc >= 75 ? 0 : sc >= 50 ? 1 : sc >= 30 ? 2 : 3]; };
    var paid = s.plan !== 'Free';

    var startSurvey = function(){ self.setState({ inSurvey:true, qIdx:0, sub:null, lockId:null, answers:blank() }); };
    var goTab = function(k){ return function(){ self.setState({ tab:k, sub:null, inSurvey:false, lockId:null }); }; };
    var needDone = function(o){ return function(){ if (!s.done) { startSurvey(); return; } self.setState(o); }; };

    // survey
    var q = Q[s.qIdx];
    var qd = dimOf(q.d);
    var opts = q['o' + L].map(function(txt, i){
      return { letter: 'ABCD'.charAt(i), text: txt, cls: s.answers[s.qIdx] === i ? 'sel' : '',
        pick: function(){
          var na = s.answers.slice(); na[s.qIdx] = i;
          self.setState({ answers: na });
          clearTimeout(self.advT);
          self.advT = setTimeout(function(){
            if (s.qIdx < 9) { self.setState({ qIdx: s.qIdx + 1 }); }
            else {
              var r = self.calc(na);
              var prev = self.state.history[0];
              var h = { score: r.total, persona: r.persona, at: Date.now(), prev: prev ? prev.score : null };
              self.setState({ done:true, inSurvey:false, tab:'analytics', aView:'readiness', sub:null, save:0, delay:0, history:[h].concat(self.state.history) });
            }
          }, 280);
        } };
    });
    var bubbleLine = t.cheer[s.qIdx].replace('{n}', name || t.guest);

    var homeDims = DIMS.map(function(d){ return { label: d[L], desc: d['d' + L], bg: d.bg, fg: d.fg, icon: IC[d.k] }; });
    var resDims = res.ds.map(function(d){ return { label: d[L], score: d.score, levelLabel: dlab(d.score), bg: d.bg, fg: d.fg, icon: IC[d.k], barBg: d.barBg, wPct: Math.round(d.w * 100) }; });

    // radar
    var cx = 180, cy = 146, R = 82;
    var ang = function(i){ return -Math.PI / 2 + i * 2 * Math.PI / 5; };
    var pt = function(i, v){ return (cx + Math.cos(ang(i)) * R * v / 100).toFixed(1) + ',' + (cy + Math.sin(ang(i)) * R * v / 100).toFixed(1); };
    var ring = function(v){ return [0,1,2,3,4].map(function(i){ return pt(i, v); }).join(' '); };
    var lab = function(i){
      var cv = Math.cos(ang(i)), sv = Math.sin(ang(i));
      var x = cx + cv * (R + 16), y = cy + sv * (R + 16);
      var a = Math.abs(cv) < 0.2 ? 'middle' : (cv > 0 ? 'start' : 'end');
      var ny = i === 0 ? y - 20 : (sv > 0.5 ? y + 8 : y - 2);
      return { x: x.toFixed(1), y: ny.toFixed(1), y2: (ny + 15).toFixed(1), a: a, t: res.ds[i][L], s: res.ds[i].score + '/100' };
    };
    var vtx = function(i){ var v = Math.max(res.ds[i].score, 4); return { x: (cx + Math.cos(ang(i)) * R * v / 100).toFixed(1), y: (cy + Math.sin(ang(i)) * R * v / 100).toFixed(1) }; };
    var sorted = res.ds.slice().sort(function(a, b){ return b.score - a.score; });
    var radar = { r1: ring(25), r2: ring(50), r3: ring(75), r4: ring(100),
      axes: [0,1,2,3,4].map(function(i){ return 'M' + cx + ' ' + cy + 'L' + pt(i, 100).replace(',', ' '); }).join(' '),
      ideal: ring(80), user: res.ds.map(function(d, i){ return pt(i, Math.max(d.score, 4)); }).join(' '),
      labels: [0,1,2,3,4].map(function(i){
        var k = 330 / 360, cv = Math.cos(ang(i)), sv = Math.sin(ang(i));
        var x = (cx + cv * (R + 10)) * k, y = (cy + sv * (R + 10)) * k;
        var TF = ['translate(-50%,-100%)', 'translate(0,-50%)', 'translate(-15%,0)', 'translate(-85%,0)', 'translate(-100%,-50%)'];
        var AL = ['center', 'left', 'left', 'right', 'right'];
        return { x: x.toFixed(1), y: y.toFixed(1), tf: TF[i], al: AL[i], n: res.ds[i][L], s: res.ds[i].score + '/100' };
      }),
      l0: lab(0), l1: lab(1), l2: lab(2), l3: lab(3), l4: lab(4), p0: vtx(0), p1: vtx(1), p2: vtx(2), p3: vtx(3), p4: vtx(4),
      best: sorted[0][L], worst: sorted[4][L] };

    // waterfall
    var factors = Q.map(function(qq, i){ var w = dimOf(qq.d).w; return { label: qq['f' + L], c: (w / 2) * (res.qs(i) - 50) }; })
      .sort(function(a, b){ return Math.abs(b.c) - Math.abs(a.c); });
    var cum = 50, pts = [50];
    factors.forEach(function(f){ f.from = cum; cum += f.c; f.to = cum; pts.push(cum); });
    var lo = Math.floor(Math.min.apply(null, pts) - 4), hi = Math.ceil(Math.max.apply(null, pts) + 4);
    var sc = function(v){ return (v - lo) / (hi - lo) * 100; };
    var wf = [{ label: t.baseline, left: 0, width: sc(50).toFixed(1), color: '#b9c6ee', val: '50', tc: '#4650cf', fw: 600 }];
    factors.forEach(function(f){
      var a = Math.min(f.from, f.to), b = Math.max(f.from, f.to);
      wf.push({ label: f.label, left: sc(a).toFixed(1), width: Math.max(sc(b) - sc(a), 1.2).toFixed(1),
        color: f.c >= 0 ? '#1fbf7a' : '#ef4f7d', val: (f.c >= 0 ? '+' : '−') + Math.abs(f.c).toFixed(1), tc: f.c >= 0 ? '#0b7a4f' : '#b8174c', fw: 400 });
    });
    wf.push({ label: t.finalScore, left: 0, width: sc(res.exact).toFixed(1), color: 'linear-gradient(90deg,#1d4ff0,#2fc6d8)', val: String(res.total), tc: '#1d4ff0', fw: 700 });
    var posF = factors.filter(function(f){ return f.c > 0; }), negF = factors.filter(function(f){ return f.c < 0; });
    var one = function(tpl, a){ return tpl.replace('{a}', a).replace(' และ “{b}”', '').replace(' and “{b}”', ''); };
    var xai = {
      pos: posF.length >= 2 ? t.posTpl.replace('{a}', posF[0].label).replace('{b}', posF[1].label) : (posF.length ? one(t.posTpl, posF[0].label) : '—'),
      neg: negF.length >= 2 ? t.negTpl.replace('{a}', negF[0].label).replace('{b}', negF[1].label) : (negF.length ? one(t.negTpl, negF[0].label) : '—')
    };

    // priorities
    var IMP = [['High Impact','#ffe0e8','#c9174f'],['Medium Impact','#dcf7ea','#0b7a4f'],['Medium Impact','#dcf7ea','#0b7a4f'],['Low Impact','#e3ebff','#2a4fd0'],['Low Impact','#e3ebff','#2a4fd0']];
    var priSorted = res.ds.slice().sort(function(a, b){ return b.w * (100 - b.score) - a.w * (100 - a.score); });
    var pri = priSorted.map(function(d, i){ return { rank: i + 1, label: d[L], tip: d['t' + L], bg: d.bg, fg: d.fg, icon: IC[d.k], impact: IMP[i][0], ibg: IMP[i][1], ifg: IMP[i][2] }; });
    var topPri = { label: priSorted[0][L], tip: priSorted[0]['t' + L] };
    var topPriText = L === 'th' ? t.focusOn + priSorted[0][L] + ' — ' + priSorted[0].tth : t.focusOn + ' ' + priSorted[0].en.toLowerCase() + ' readiness — ' + priSorted[0].ten;

    // ---- Personalized Portfolio Allocation (risk level + persona)
    var a = s.answers;
    var riskPts = (a[3] == null ? 0 : a[3]) + ((a[0] != null && a[0] >= 2) ? 1 : 0) + ((res.persona === 'secure' || res.persona === 'high') ? 1 : 0);
    var rl = riskPts <= 1 ? 0 : riskPts <= 3 ? 1 : 2;
    var TPL = [[10,15,45,10,20],[15,30,35,10,10],[20,45,20,10,5]];
    var TW = { fragile:[-5,-5,0,0,10], sandwich:[0,-5,0,0,5], secure:[0,5,-5,0,0], high:[0,5,0,0,-5] }[res.persona];
    var alloc = TPL[rl].map(function(v, i){ return Math.max(0, v + TW[i]); });
    var acc = 0, segs = {};
    alloc.forEach(function(p, i){ segs['s' + i] = { c: ASSETS[i].c, d: p + ' ' + (100 - p), o: String(25 - acc) }; acc += p; });
    var pf = Object.assign(segs, { list: alloc.map(function(p, i){ return { name: ASSETS[i][L], role: ASSETS[i]['r' + L], p: p, c: ASSETS[i].c }; }) });
    var RISKC = [['#dcf7ea','#0b7a4f'],['#fff2cc','#7a4f00'],['#ffe3ea','#b8174c']];
    var risk = { label: t.riskLabels[rl], bg: RISKC[rl][0], fg: RISKC[rl][1] };
    var letterOf = function(i){ return a[i] == null ? '-' : 'ABCD'.charAt(a[i]); };
    var reasons = [
      { t: t.rs1.replace('{r}', t.riskLabels[rl]).replace('{l}', letterOf(3)) },
      { t: (a[0] != null && a[0] >= 2) ? t.rs2ok : t.rs2low },
      { t: t.rs3.replace('{p}', P.name) }
    ];
    var KPC = { secure:'#1fbf7a', high:'#1d4ff0', fragile:'#f0568b', sandwich:'#8a4be6' };
    var kp = Object.keys(CENT).map(function(k){ return { k: k, name: PERSONAS[k].name, p: Math.max(0, Math.round(100 * (1 - res.dists[k] / 29))), c: KPC[k], fw: k === res.persona ? 700 : 400 }; })
      .sort(function(x, y){ return y.p - x.p; });

    // ---- What-if Scenario Simulator
    var fmtNum = function(n){ return Number(n).toLocaleString(L === 'th' ? 'th-TH' : 'en-US'); };
    var disp = function(k, v){
      if (k === 'save') return '+' + v + '%';
      if (k === 'delay') return '+' + v + ' ' + (L === 'th' ? 'ปี' : 'yrs');
      if (k === 'dca') return '฿' + fmtNum(v);
      if (k === 'ret') return '+' + v + (L === 'th' ? '%/ปี' : '%/yr');
      if (k === 'emerg') return v + ' ' + (L === 'th' ? 'เดือน' : 'mo');
      return (L === 'th' ? 'ลด ' : '−') + v + '%';
    };
    var raw = 0, parts = [];
    // debt lever only for users who carry debt (Q2 answer A-C; D = no debt / under 10%)
    var hasDebt = a[1] != null && a[1] < 3;
    var SVU = SV.filter(function(d){ return d.k !== 'debt' || hasDebt; });
    SVU.forEach(function(d){ var c = s.sv[d.k] * d.w; raw += c; parts.push({ label: d[L], c: c }); });
    ST.forEach(function(d){ var c = s.sv[d.k] ? d.w : 0; raw += c; parts.push({ label: d[L], c: c }); });
    var gain = (99 - res.prob) * (1 - Math.exp(-raw / 45));
    var simProb = Math.min(99, Math.round(res.prob + gain));
    var imp = function(c){ if (raw <= 0 || c <= 0) return ''; var x = gain * c / raw; return '+' + (x < 1 ? '<1' : Math.round(x)) + '%'; };
    var setSv = function(k, val){ var o = Object.assign({}, self.state.sv); o[k] = val; self.setState({ sv: o }); };
    var sliders = SVU.map(function(d){ var v = s.sv[d.k]; return { id: 'sv-' + d.k, label: d[L], min: d.min, max: d.max, step: d.step, val: v, disp: disp(d.k, v), imp: imp(v * d.w), icon: IC[d.icon],
      onChange: function(e){ setSv(d.k, Number(e.target.value)); } }; });
    var simToggles = ST.map(function(d){ var on = !!s.sv[d.k]; return { label: d[L], sub: d['s' + L], on: on, imp: imp(on ? d.w : 0),
      flip: function(e){ setSv(d.k, e && e.target ? !!e.target.checked : !on); } }; });
    var topPart = parts.filter(function(p){ return p.c > 0; }).sort(function(x, y){ return y.c - x.c; })[0];
    var dlt = simProb - res.prob;
    var sim = { prob: simProb, base: res.prob, delta: '+' + dlt + '%', changed: dlt > 0, same: dlt <= 0,
      aha: dlt >= 1 && topPart ? t.ahaTpl.replace('{l}', topPart.label).replace('{x}', dlt) : t.ahaIdle };
    var wk = priSorted[0];
    var nudge = { title: NUDGE[wk.k][L], icon: IC[wk.k], fg: wk.fg };

    // ---- Monetization nudges (products matched to weakest dimensions)
    var prodKeys = [];
    priSorted.forEach(function(d){ PROD_BY_DIM[d.k].forEach(function(k){ if (prodKeys.indexOf(k) < 0 && (k !== 'debt' || hasDebt)) prodKeys.push(k); }); });
    var nudges = prodKeys.slice(0, 4).map(function(k){ var p = PRODUCTS[k], x = p[L];
      return { title: x.t, sub: x.s, type: x.type, c1: p.c1, c2: p.c2, icon: IC[p.icon], open: function(){ self.setState({ sub:'product', productKey: k, prodFrom: self.state.sub }); } }; });
    var homeNudge = nudges[0];
    var pd = PRODUCTS[s.productKey] || PRODUCTS.hea, pdx = pd[L];
    var prod = { title: pdx.t, sub: pdx.s, type: pdx.type, why: pdx.why, c1: pd.c1, c2: pd.c2, icon: IC[pd.icon], isInv: !!pd.inv, pts: pdx.pts.map(function(z){ return { t: z }; }) };

    // shorts
    var order = priSorted.map(function(d){ return d.k; });
    var list = [];
    order.forEach(function(k){ VIDS[k].forEach(function(v){ list.push(Object.assign({ k: k }, v)); }); });
    var forLabel = s.done ? t.insightsFor + ' ' + P.name : t.forYou;
    var mk = function(v, i){ return { title: v[L], dur: v.dur, c1: v.c1, c2: v.c2, icon: IC[v.k], n: (i + 1) + '/' + list.length,
      expert: t.expert, prog: [18, 42, 8, 65, 30, 12][i % 6], forLabel: forLabel,
      play: function(){ self.showToast(t.tPlay); }, open: function(){ self.setState({ sub:'shorts', shortsStart: i }); } }; };
    var vids = list.map(mk);
    var st = s.shortsStart % vids.length;
    var shortsList = vids.slice(st).concat(vids.slice(0, st));
    var nudgeVid = Object.assign({}, vids[0], { expert: t.expert + ' · ' + vids[0].dur });

    // on-demand
    var CC = { fin:['#1f6fe8','#2fc6d8'], inv:['#e0386f','#ff8fb5'], hea:['#d99a00','#ffcf4d'], fam:['#0f9e6c','#4fdba3'], psy:['#7a3ee0','#b38cff'] };
